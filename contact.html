<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Anoop Banakar for web development opportunities, projects, and professional collaboration.">

    <meta name="author" content="Anoop Banakar">

    <title>Contact Anoop Banakar | Web Developer</title>

    <!-- ✅ Added canonical -->
    <link rel="canonical" href="https://yourdomain.com/contact.html">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Skip link for keyboard users -->
    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <!-- Header -->
    <header>

        <nav aria-label="Main navigation">

            <a href="index.html" aria-label="Go to homepage">
                Anoop Banakar
            </a>

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- Main content -->
    <main id="main-content">

        <!-- Contact section -->
        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">
                Contact Me
            </h1>

            <p>
                If you would like to get in touch, please use the
                contact form below.
            </p>

            <!-- Accessible contact form -->
            <form action="#" method="post">

                <div>
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div>
                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Anoop Banakar. All rights reserved.
        </p>

    </footer>

</body>

</html>
